openapi: 3.0.4
info:
  title: Other API
  version: v1
servers:
  - url: https://other.example.com
paths:
  /zones:
    get:
      operationId: zones.ListZones
      summary: List zones
      tags: [zones]
      responses:
        "200": { description: ok }
    post:
      operationId: zones.CreateZone
      summary: Create a zone
      tags: [zones]
      responses:
        "201": { description: created }
  /me/sendMail:
    post:
      operationId: me.sendMail
      summary: Send a mail message
      tags: [me]
      responses:
        "202": { description: accepted }
