name: Event Gateway

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/event-gateway
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13.14"
      - run: uv sync --frozen
      - name: Verify vendored contract hashes without credentials
        run: uv run --frozen python scripts/sync_contract.py --check
      - name: Lint Python
        run: uv run --frozen ruff check src tests scripts
      - name: Test gateway
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build wheel
        run: uv build --wheel
      - name: Smoke test isolated installed wheel offline
        run: |
          wheel=$(find "$PWD/dist" -name '*.whl' -print -quit)
          test -n "$wheel"
          consumer=$(mktemp -d "$RUNNER_TEMP/event-gateway-consumer.XXXXXX")
          uv venv --python 3.13.14 "$consumer/venv"
          uv pip install --python "$consumer/venv/bin/python" "$wheel"
          cd "$consumer"
          "$consumer/venv/bin/knitli-event-gateway" --help
          "$consumer/venv/bin/knitli-event-gateway" --state-dir "$consumer/state" status > status.json
          "$consumer/venv/bin/python" -I - <<'PYTHON'
          import json
          from importlib.resources import files
          from event_gateway.protocol import parse_envelope
          status = json.load(open("status.json"))
          assert status["automaticWakeEnabled"] is False
          assert "cloud_authority_not_integrated" in status["blockers"]
          assert files("event_gateway").joinpath("contracts/event-v1/protocol.schema.json").is_file()
          PYTHON
