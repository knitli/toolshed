name: Event Gateway Trusted Contract

# Only trusted main workflow code runs. Candidate blobs are data, never code.
# Authorize complete families here before rotating consumer snapshots.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_run:
    workflows: [Event Gateway]
    types: [completed]
  push:
    branches: [main]
    paths: [.github/workflows/event-gateway-contract.yml]

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Keep queued refreshes and serialize publication across policy changes.
concurrency:
  group: event-gateway-trusted-contract
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify immutable contract bytes (trusted main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
