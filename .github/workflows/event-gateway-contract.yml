          def read_blob(path, ref, token):
              value = request_json("contents/" + path + "?" + urllib.parse.urlencode({"ref": ref}), token)
              if value["type"] != "file" or value["encoding"] != "base64":
                  raise ValueError("not an encoded file")
              blob = base64.b64decode("".join(value["content"].splitlines()), validate=True)
              if value["size"] != len(blob):
                  raise ValueError("size mismatch")
              return blob


          def verify_contract(head, token):
              if not isinstance(head, str) or not re.fullmatch(r"[0-9a-f]{40}", head):
                  raise ValueError("invalid head")
              tree = request_json(f"git/trees/{head}?recursive=1", token)
              if tree.get("truncated") is not False:
                  raise ValueError("incomplete candidate tree")
              entries = {entry["path"]: entry for entry in tree["tree"]}
              for path in PATHS:
                  entry = entries.get(SNAPSHOT + path, {})
                  if entry.get("type") != "blob" or entry.get("mode") not in ("100644", "100755"):
                      raise ValueError("contract path is not a regular Git blob")
              hashes = {
                  path: hashlib.sha256(read_blob(SNAPSHOT + path, head, token)).hexdigest()
                  for path in PATHS
              }
              for family in FAMILIES:
                  if hashes == family["hashes"]:
                      return family["name"]
              raise ValueError("contract family not authorized")

          WORKFLOW_PATH = ".github/workflows/event-gateway-contract.yml"
          STATUS_CONTEXT = "Event Gateway / trusted contract"


          def request_json(endpoint, token, payload=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/knitli/toolshed/" + endpoint,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              for attempt in range(3):
                  try:
                      with urllib.request.build_opener(NoRedirect).open(request, timeout=20) as response:
                          raw = response.read(LIMIT + 1)
                      if len(raw) > LIMIT:
                          raise ValueError("oversized API response")
                      return json.loads(raw)
                  except urllib.error.HTTPError as error:
                      if payload is not None or error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError):
                      if payload is not None or attempt == 2:
                          raise
                  time.sleep(attempt + 1)


          def open_pulls(token):
              page = 1
              while True:
                  pulls = request_json(f"pulls?state=open&per_page=50&page={page}", token)
                  if not isinstance(pulls, list):
                      raise ValueError("invalid pull request list")
                  yield from pulls
                  if len(pulls) < 50:
                      return
                  page += 1


          def selected_pulls(event_name, event, token):
              if event_name == "pull_request_target":
                  pull = event["pull_request"]
                  return [{"number": pull["number"], "head": {"sha": pull["head"]["sha"]}}]
              if event_name == "workflow_run":
                  head = event["workflow_run"]["head_sha"]
                  if not isinstance(head, str) or not re.fullmatch(r"[0-9a-f]{40}", head):
                      raise ValueError("invalid triggering head")
                  return (pull for pull in open_pulls(token) if pull["head"]["sha"] == head)
              if event_name == "push" and event["ref"] == "refs/heads/main":
                  return open_pulls(token)
              raise ValueError("unsupported trusted event")


          def publish_if_current(number, head, state, description, token, run_url, workflow_source):
              if type(number) is not int or number < 1 or not isinstance(head, str) or not re.fullmatch(r"[0-9a-f]{40}", head):
                  raise ValueError("invalid candidate")
              pull = request_json(f"pulls/{number}", token)
              if pull["state"] != "open" or pull["head"]["sha"] != head:
                  return False
              main_sha = request_json("git/ref/heads/main", token)["object"]["sha"]
              if not isinstance(main_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", main_sha):
                  raise ValueError("invalid main revision")
              # An older queued run must not overwrite a result from a newer policy.
              if read_blob(WORKFLOW_PATH, main_sha, token) != workflow_source:
                  return False
              request_json(f"statuses/{head}", token, {
                  "state": state, "context": STATUS_CONTEXT, "description": description,
                  "target_url": run_url})
              return True


          def revalidate(token, run_url, workflow_sha, event_name, event):
              if not isinstance(workflow_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", workflow_sha):
                  raise ValueError("invalid workflow revision")
              workflow_source = read_blob(WORKFLOW_PATH, workflow_sha, token)
              results = []
              publication_failed = False
              for pull in selected_pulls(event_name, event, token):
                  number, head = pull["number"], pull["head"]["sha"]
                  try:
                      if not publish_if_current(number, head, "pending", "Checking complete canonical contract family",
                                                token, run_url, workflow_source):
                          continue
                      try:
                          family = verify_contract(head, token)
                          state, description = "success", "Canonical event/control family verified: " + family
                      except OSError:
                          state, description = "error", "Canonical contract could not be fetched; retry verification"
                      except (ValueError, KeyError, TypeError):
                          state, description = "failure", "Snapshot does not match a contract family authorized on main"
                      if publish_if_current(number, head, state, description, token, run_url, workflow_source):
                          results.append((number, head, state))
                          print(f"PR #{number} {head}: {state}")
                  except (ValueError, KeyError, TypeError, OSError) as error:
                      publication_failed = True
                      identifier = number if type(number) is int else "unknown"
                      print(f"PR #{identifier}: {type(error).__name__}; contract status publication failed; continuing.")
              if publication_failed:
                  raise OSError("Some contract statuses could not be published")
              return results


          if __name__ == "__main__":
              import os
              try:
                  with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
                      event = json.load(event_file)
                  revalidate(os.environ["GH_TOKEN"], os.environ["RUN_URL"], os.environ["WORKFLOW_SHA"],
                             os.environ["EVENT_NAME"], event)
              except (ValueError, KeyError, TypeError, OSError):
                  raise SystemExit("Trusted contract revalidation failed; no PR code was executed.") from None
          PYTHON
