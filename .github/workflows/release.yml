name: Release
on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        plugin: [ctx, strip-ansi, codeweaver]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun i --frozen-lockfile
      - name: Release ${{ matrix.plugin }}
        working-directory: plugins/${{ matrix.plugin }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
      - name: Regenerate plugin.json from bumped package.json
        run: bun scripts/generate.mts
      - name: Commit version sync
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(${{ matrix.plugin }}): sync plugin.json version [skip ci]"
          file_pattern: plugins/${{ matrix.plugin }}/.claude-plugin/plugin.json
  release-openapi-mcp:
    if: github.event_name == 'push'
    needs:
      - release
    runs-on: ubuntu-latest
    environment: npmrelease
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - run: bun i --frozen-lockfile
      - name: Verify package and release gates
        run: |
          bun scripts/generate.mts --check
          bun test scripts/openapi-mcp-release.test.ts
          bun test packages/openapi-mcp
          bun run --cwd packages/openapi-mcp test:node-transport
          bun run --cwd packages/openapi-mcp test:node-stdio
          bun run validate
      - name: Release exact tested openapi-mcp tarball through OIDC
        if: vars.OPENAPI_MCP_OIDC_READY == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAPI_MCP_RELEASE_ENVIRONMENT: npmrelease
          OPENAPI_MCP_OIDC_READY: ${{ vars.OPENAPI_MCP_OIDC_READY }}
        run: node scripts/openapi-mcp-release.mjs
      - name: Report pending npm publisher setup
        if: vars.OPENAPI_MCP_OIDC_READY != 'true'
        run: echo 'npm publication is pending protected environment, bootstrap cleanup and trusted publisher verification.'
      - name: Verify fresh public install and registry attestations
        if: vars.OPENAPI_MCP_OIDC_READY == 'true'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/openapi-public-empty-user.npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/openapi-public-empty-global.npmrc
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/openapi-mcp-release"
          if [ ! -f "$evidence/tested-artifact.json" ]; then exit 0; fi
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).version' "$evidence/tested-artifact.json")
          tarball="$evidence/knitli-openapi-mcp-$version.tgz"
          consumer=$(mktemp -d "$RUNNER_TEMP/openapi-public-XXXXXX")
          cd "$consumer"
          npm init -y
          node "$GITHUB_WORKSPACE/scripts/openapi-mcp-release.mjs" wait-for-version "$version"
          npm install --ignore-scripts --save-exact --registry=https://registry.npmjs.org/ "@knitli/openapi-mcp@$version"
          npm audit signatures --json --include-attestations > "$evidence/npm-audit-signatures.json"
          node "$GITHUB_WORKSPACE/scripts/openapi-mcp-release.mjs" verify-audit "$evidence/npm-audit-signatures.json" "$tarball" "$version" > "$evidence/verified-provenance.json"
          cp "$GITHUB_WORKSPACE/packages/openapi-mcp/test-consumers/node.mts" "$consumer/node.mts"
          node node.mts > "$evidence/public-consumer.json"
          sha256sum "$evidence/npm-audit-signatures.json" > "$evidence/npm-audit-signatures.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi-mcp-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openapi-mcp-release/
          if-no-files-found: ignore

  release-marketplace:
    if: github.event_name == 'push'
    needs:
      - release
      - release-openapi-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: bun i --frozen-lockfile
      - name: Release marketplace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
      - name: Regenerate marketplace.json from bumped package.json
        run: bun scripts/generate.mts
      - name: Commit marketplace version sync
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(marketplace): sync marketplace.json version [skip ci]"
          file_pattern: .claude-plugin/marketplace.json
