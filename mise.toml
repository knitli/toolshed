[settings]
experimental = true

[env]
MISE_EXPERIMENTAL = 1
MISE_YES = 1
MISE_TRUST = 1

[tool_alias]
codacy = "npm:@codacy-cloud-cli"

[tools]
bun = "latest"
node = "24"
shfmt = "latest"
shellcheck = "latest"
yq = "latest"
"npm:sort-package-json" = "latest"
uv = "latest"
biome = "latest"
hk = "latest"
fnox = "latest"
codacy = "latest"

[deps]
[deps.bun]
auto = true

[tasks.lint]
run = "hk check"

[tasks.lint.tools]
biome = "latest"
shellcheck = "latest"
"npm:sort-package-json" = "latest"
shfmt = "latest"
yq = "latest"

[tasks.fix]
run = "hk fix"

[tasks.fix.tools]
biome = "latest"
"npm:sort-package-json" = "latest"
shfmt = "latest"
yq = "latest"

[shell_alias]
codacy = "fnox exec -- codacy"
